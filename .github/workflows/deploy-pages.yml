name: Deploy PLOT OS demos to GitHub Pages

on:
  push:
    branches:
      - demo/plot-os-v2
    paths:
      - "web-v2/**"
      - "plot-os-demo/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plot-os-demo/package-lock.json

      - name: Build old demo at site root
        working-directory: plot-os-demo
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/client/index.html

      - name: Stage old demo at site root and v2 under /v2/
        env:
          NAVER_MAPS_CLIENT_ID: ${{ secrets.NAVER_MAPS_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pages_out
          cp -a plot-os-demo/dist/client/. _pages_out/
          test -s _pages_out/index.html || { echo '::error::Old root index missing; deployment stopped.'; exit 1; }
          # Discard only a previous v2 copy; preserve every old root asset.
          rm -rf _pages_out/v2
          mkdir -p _pages_out/v2
          cp -a web-v2/. _pages_out/v2/
          rm -f _pages_out/v2/local-naver-config.js
          python3 - <<'PY'
          from pathlib import Path
          index = Path('_pages_out/v2/index.html')
          html = index.read_text(encoding='utf-8')
          assert '<base ' not in html, 'Review existing base before deployment'
          html = html.replace('<head>', '<head>\n    <base href="/RealEstateProject/v2/">', 1)
          assert '<base href="/RealEstateProject/v2/">' in html
          index.write_text(html, encoding='utf-8')
          PY
          test -s _pages_out/v2/js/app.js
          if [ -n "$NAVER_MAPS_CLIENT_ID" ]; then
            printf "window.PLOT_OS_NAVER_CONFIG = { clientId: '%s' };\n" "$NAVER_MAPS_CLIENT_ID" > _pages_out/v2/local-naver-config.js
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages_out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
