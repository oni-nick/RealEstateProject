name: Deploy PLOT OS demos to GitHub Pages

on:
  push:
    branches:
      - demo/plot-os-v2
    paths:
      - "web-v2/**"
      - "plot-os-demo/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # Restore the last successful Pages artifact if no built root exists.
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preserve old demo at site root
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pages_out
          if [ -f plot-os-demo/dist/client/index.html ]; then
            cp -a plot-os-demo/dist/client/. _pages_out/
          elif git fetch --depth=1 origin gh-pages; then
            git archive FETCH_HEAD | tar -x -C _pages_out
          else
            # Actions-based Pages deployments may have no gh-pages branch.
            restored=false
            for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-pages.yml --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
              artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | head -n 1)
              if [ -n "$artifact_id" ]; then
                gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/previous-pages.zip"
                unzip -q "$RUNNER_TEMP/previous-pages.zip" -d "$RUNNER_TEMP/previous-pages"
                tar -xf "$RUNNER_TEMP/previous-pages/artifact.tar" -C _pages_out
                restored=true
                break
              fi
            done
            if [ "$restored" != true ]; then
              echo '::error::Old demo unavailable. Refusing to replace the live site.'
              exit 1
            fi
          fi
          test -s _pages_out/index.html || { echo '::error::Old root index missing; deployment stopped.'; exit 1; }

      - name: Stage static v2 under its own path
        shell: bash
        run: |
          set -euo pipefail
          # Discard only a previous v2 copy; preserve every old root asset.
          rm -rf _pages_out/v2
          mkdir -p _pages_out/v2
          cp -a web-v2/. _pages_out/v2/
          # Never carry a local config into the artifact from the checkout.
          rm -f _pages_out/v2/local-naver-config.js
          # Deployment-only base keeps localhost previews at their own root.
          python3 - <<'PY'
          from pathlib import Path
          index = Path('_pages_out/v2/index.html')
          html = index.read_text(encoding='utf-8')
          assert '<base ' not in html, 'Review existing base before deployment'
          html = html.replace('<head>', '<head>\n    <base href="/RealEstateProject/v2/">', 1)
          assert '<base href="/RealEstateProject/v2/">' in html
          index.write_text(html, encoding='utf-8')
          PY
          test -s _pages_out/v2/js/app.js

      - name: Inject optional Naver runtime configuration
        env:
          NAVER_MAPS_CLIENT_ID: ${{ secrets.NAVER_MAPS_CLIENT_ID }}
        shell: bash
        run: |
          if [ -n "$NAVER_MAPS_CLIENT_ID" ]; then
            printf "window.PLOT_OS_NAVER_CONFIG = { clientId: '%s' };\n" "$NAVER_MAPS_CLIENT_ID" > _pages_out/v2/local-naver-config.js
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages_out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
